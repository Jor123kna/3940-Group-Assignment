<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trivia - Multiplayer Player</title>
    <link rel="stylesheet" href="triviaUser.css" />

    <script>
      const urlParams = new URLSearchParams(window.location.search);

      // The lobby already passes its WebSocket URL to this page.
      const lobbySocketUrl = urlParams.get("websocket");

      // Extract the lobby code from the WebSocket URL.
      const socketUrl = new URL(lobbySocketUrl);
      const pathParts = socketUrl.pathname.split("/");
      const lobbyCode = pathParts[pathParts.length - 1];

      const myName = sessionStorage.getItem("displayName");
      const isHost = sessionStorage.getItem("adminFor") === lobbyCode;
      const time = sessionStorage.getItem("timePerQuestion");
      const catagory = sessionStorage.getItem("selectedCategory");

      // Reconnect using the exact WebSocket URL provided by the lobby.
      let webSocket = new WebSocket(lobbySocketUrl);

      // The host stores the questions returned by the server.
      let gameQuestions = [];
      let currentQuestionIndex = -1;
      let currentCategoryName = catagory;

      const SHAPES = ["▲", "◆", "●", "■"];
      const ANSWER_CLASSES = ["answer-a", "answer-b", "answer-c", "answer-d"];

      const RESULTS_DELAY_MS = 4000; // how long results show before next question
      const BASE_POINTS = 1000; // points for a correct answer
      const SPEED_BONUS = 500; // extra points scaled by remaining time

      /* ---------- shared (all clients) state ---------- */
      let currentQ = null; // last question_start data received
      let selectedAnswerId = null;
      let hasSubmitted = false;
      let countdownTimer = null;
      let secondsLeft = 0;
      let myScore = 0;

      let players = {}; // username -> total score
      let answers = {}; // username -> {answerId, timeLeft}
      let questionOpen = false;
      let questionEndsAt = 0;
      let hostTimeout = null;
      let gameStarted = false;

      // WebSocket event handlers.
      webSocket.onopen = wsOpen;
      webSocket.onmessage = wsGetMessage;
      webSocket.onclose = wsClose;
      webSocket.onerror = wsError;

      function wsOpen() {
        console.log("Connected as user: " + myName);
        document.getElementById("playerName").textContent = myName || "Guest";

        send({ type: "join", username: myName });

        if (isHost) {
          players[myName] = 0;

          // Ask players who are already connected to identify themselves.
          send({ type: "request_players" });

          startHostGame();
        } else {
          startPlayerGame();
        }
      }

      function wsGetMessage(message) {
        let data;
        try {
          data = JSON.parse(message.data.replace(/&quot;/g, '"'));
        } catch (e) {
          console.error("Could not read WebSocket message:", message.data, e);
          return;
        }

        switch (data.type) {
          /* ----- messages everyone handles ----- */
          case "question_start":
            // Ignore messages aimed at a different (late-joining) player.
            if (data.target && data.target !== myName) return;
            renderQuestion(data);
            break;

          case "question_end":
            showQuestionResults(data);
            break;

          case "game_over":
            showGameOver(data);
            break;

          /* ----- messages only the host cares about ----- */
          case "request_players":
            // Players tell the host they are connected.
            if (!isHost) {
              send({ type: "player_ready", username: myName });
            }
            break;

          case "join":
            // Player registration is handled by player_ready.
            break;

          case "player_ready":
            if (isHost) {
              hostPlayerJoined(data.username);
            }
            break;

          case "answer_submitted":
            if (isHost) hostReceiveAnswer(data);
            break;

          default:
            console.log("Received message:", data);
        }
      }

      function wsClose() {
        setGameStatus("Disconnected from the server.");
        stopCountdown();
      }

      function wsError(e) {
        console.error("WebSocket connection error:", e);
        setGameStatus("There was a connection error.");
      }

      function send(obj) {
        if (webSocket.readyState === WebSocket.OPEN) {
          webSocket.send(JSON.stringify(obj));
        }
      }

      // HTTP helpers copied from triviaSolo.html.
      function request(method, url, body, onSuccess, onError) {
        const xhttp = new XMLHttpRequest();

        xhttp.onreadystatechange = function () {
          if (this.readyState != 4) return;

          if (this.status == 200) {
            try {
              onSuccess(JSON.parse(this.responseText));
            } catch (e) {
              onError("The server sent a response that could not be read.");
            }
          } else {
            onError(
              "The server returned an error (status " + this.status + ").",
            );
          }
        };

        xhttp.open(method, url, true);

        if (body !== null) {
          xhttp.setRequestHeader(
            "Content-Type",
            "application/x-www-form-urlencoded",
          );
        }

        xhttp.send(body);
      }

      function getJson(url, onSuccess, onError) {
        request("GET", url, null, onSuccess, onError);
      }

      function setGameStatus(message) {
        document.getElementById("gameStatus").textContent = message;
      }

      // The host loads the questions for the selected category.
      function startHostGame() {
        if (!catagory) {
          setGameStatus("No category selected.");
          console.error("No category selected in sessionStorage.");
          return;
        }

        setGameStatus("Loading questions...");

        // Find the category ID using the selected category name.
        getJson(
          "categories",
          function (categories) {
            const selected = categories.find(function (category) {
              return category.category_name === catagory;
            });

            if (!selected) {
              setGameStatus("Could not find the selected category.");
              console.error("Category not found:", catagory);
              return;
            }

            // Fetch questions belonging to the selected category.
            getJson(
              "questions?category_id=" +
                encodeURIComponent(selected.category_id),

              function (questions) {
                if (questions.length === 0) {
                  setGameStatus("No questions found in this category.");
                  return;
                }

                gameQuestions = questions;
                currentQuestionIndex = 0;
                currentCategoryName = selected.category_name;

                console.log("Questions loaded:", gameQuestions);

                // Display question 1 locally and send it to the players.
                sendCurrentQuestion();
              },

              function (message) {
                setGameStatus("Could not load questions.");
                console.error(message);
              },
            );
          },
          function (message) {
            setGameStatus("Could not load categories.");
            console.error(message);
          },
        );
      }

      // Send the current question to all players or one specific player.
      function broadcastQuestion(target) {
        if (gameQuestions.length === 0) return;

        const duration = getQuestionDuration();
        const timeLeft = Math.max(
          0,
          Math.ceil((questionEndsAt - Date.now()) / 1000),
        );

        const data = {
          type: "question_start",
          questionIndex: currentQuestionIndex,
          totalQuestions: gameQuestions.length,
          categoryName: currentCategoryName,
          timePerQuestion: duration,
          timeLeft: target ? timeLeft : duration,
          question: gameQuestions[currentQuestionIndex],
        };

        if (target) {
          data.target = target;
        } else {
          // The server does not echo the host's message back to itself.
          renderQuestion(data);
        }

        send(data);
      }

      function hostReceiveAnswer(data) {
        if (!questionOpen) return;
        if (data.questionIndex !== currentQuestionIndex) return;
        if (!(data.username in players)) players[data.username] = 0;
        if (answers[data.username]) return; // first answer wins

        answers[data.username] = {
          answerId: data.answerId,
          timeLeft: data.timeLeft,
        };

        const answered = Object.keys(answers).length;
        const total = Object.keys(players).length;
        setGameStatus("Answers received: " + answered + " / " + total);

        if (answered >= total) {
          endQuestion();
        }
      }

      function endQuestion() {
        if (!questionOpen) return;
        questionOpen = false;
        clearTimeout(hostTimeout);

        const index = currentQuestionIndex;
        const question = gameQuestions[index];
        const names = Object.keys(players);

        // Check every player's answer, then score and broadcast.
        Promise.all(
          names.map(function (name) {
            const a = answers[name];
            if (!a)
              return Promise.resolve({
                name: name,
                correct: false,
                points: 0,
                answered: false,
              });

            return checkAnswer(question, a.answerId).then(function (correct) {
              const points = correct
                ? BASE_POINTS +
                  Math.round(SPEED_BONUS * (a.timeLeft / getQuestionDuration()))
                : 0;
              return {
                name: name,
                correct: correct,
                points: points,
                answered: true,
              };
            });
          }),
        ).then(function (list) {
          const results = {};
          list.forEach(function (r) {
            players[r.name] += r.points;
            results[r.name] = {
              correct: r.correct,
              points: r.points,
              answered: r.answered,
            };
          });

          const data = {
            type: "question_end",
            questionIndex: index,
            results: results,
            scores: Object.assign({}, players),
            isLast: index >= gameQuestions.length - 1,
          };

          showQuestionResults(data); // host shows locally
          send(data);

          setTimeout(nextQuestion, RESULTS_DELAY_MS);
        });
      }

      function finishGame() {
        questionOpen = false;
        clearTimeout(hostTimeout);
        stopCountdown();
        const data = { type: "game_over", scores: Object.assign({}, players) };
        showGameOver(data);
        send(data);
      }

      function checkAnswer(question, answerId) {
        return new Promise(function (resolve) {
          request(
            "POST",
            "answer",
            "answer_id=" + encodeURIComponent(answerId),

            function (result) {
              resolve(
                result.correct === true ||
                  result.correct === 1 ||
                  result.correct === "true",
              );
            },

            function (message) {
              console.error("Could not check answer:", message);
              resolve(false);
            },
          );
        });
      }

      function getQuestionDuration() {
        return Number(time) || 30;
      }

      // Send the current question to the connected players.
      // Start a question and set the host's timeout.
      function sendCurrentQuestion() {
        if (gameQuestions.length === 0) return;

        const duration = getQuestionDuration();

        answers = {};
        questionOpen = true;
        gameStarted = true;
        questionEndsAt = Date.now() + duration * 1000;

        clearTimeout(hostTimeout);

        broadcastQuestion();

        hostTimeout = setTimeout(endQuestion, duration * 1000 + 500);
      }

      // Display a question received from the host.
      function renderQuestion(data) {
        const question = data.question;

        currentQ = data;
        currentQuestionIndex = data.questionIndex;
        selectedAnswerId = null;
        hasSubmitted = false;

        document.getElementById("submitAnswer").disabled = false;
        document.getElementById("submitAnswer").hidden = false;

        document.getElementById("categoryName").textContent = data.categoryName;

        document.getElementById("questionNumber").textContent =
          "Question " + (data.questionIndex + 1) + " of " + data.totalQuestions;

        document.getElementById("questionText").textContent =
          question.question_text;

        document.getElementById("timeRemaining").textContent =
          (data.timePerQuestion || 30) + " seconds";

        setGameStatus("The host controls when the next question appears.");

        // Display optional question media.
        const mediaContainer = document.getElementById("questionMedia");
        mediaContainer.textContent = "";

        if (question.media && question.media.type === "image") {
          const img = document.createElement("img");
          img.alt = "Question image";

          img.src = /^https?:\/\//i.test(question.media.url)
            ? question.media.url
            : "images/" + encodeURIComponent(question.media.url);

          img.onerror = function () {
            mediaContainer.hidden = true;
          };

          mediaContainer.appendChild(img);
          mediaContainer.hidden = false;
        } else {
          mediaContainer.hidden = true;
        }

        // Create answer buttons using the returned question data.
        const choices = document.getElementById("choices");
        choices.textContent = "";

        question.answers.forEach(function (answer, i) {
          const button = document.createElement("button");
          button.type = "button";
          button.className =
            "answer " + ANSWER_CLASSES[i % ANSWER_CLASSES.length];

          const shape = document.createElement("span");
          shape.className = "shape";
          shape.setAttribute("aria-hidden", "true");
          shape.textContent = SHAPES[i % SHAPES.length];

          const label = document.createElement("span");
          label.textContent = answer.answer_name;

          button.appendChild(shape);
          button.appendChild(label);

          // Keep the answer ID for implementing answer submission later.
          button.dataset.answerId = answer.answer_id;
          button.onclick = function () {
            selectAnswer(button);
          };

          choices.appendChild(button);
        });

        const countdownSeconds =
          data.timeLeft === undefined
            ? getQuestionDuration()
            : Number(data.timeLeft);

        startCountdown(Math.max(0, countdownSeconds));
      }

      function nextQuestion() {
        currentQuestionIndex++;

        if (currentQuestionIndex >= gameQuestions.length) {
          finishGame();
          return;
        }

        sendCurrentQuestion();
      }

      function hostPlayerJoined(username) {
        if (!username) return;

        // Only register a player once.
        if (username in players) return;

        players[username] = 0;

        // Send the current question to a newly connected player.
        if (questionOpen) {
          broadcastQuestion(username);
        }
      }

      // Players wait for questions sent by the host.
      function startPlayerGame() {
        setGameStatus("Waiting for the host to start the game...");
        send({ type: "player_ready", username: myName });
      }

      function selectAnswer(button) {
        if (hasSubmitted) return;

        document.querySelectorAll("#choices .answer").forEach(function (b) {
          b.style.outline = "";
          b.style.opacity = "";
        });

        selectedAnswerId = button.dataset.answerId;
        button.style.outline = "4px solid #fff";
      }

      function submitAnswer() {
        if (hasSubmitted || !currentQ) return;

        if (selectedAnswerId === null) {
          setGameStatus("Select an answer first.");
          return;
        }

        hasSubmitted = true;
        lockAnswers();

        const msg = {
          type: "answer_submitted",
          username: myName,
          questionIndex: currentQ.questionIndex,
          answerId: selectedAnswerId,
          timeLeft: secondsLeft,
        };

        setGameStatus("Answer submitted. Waiting for other players...");

        if (isHost) {
          hostReceiveAnswer(msg); // host's own answer is handled locally
        } else {
          send(msg);
        }
      }

      function lockAnswers() {
        document.querySelectorAll("#choices .answer").forEach(function (b) {
          b.disabled = true;
          if (b.dataset.answerId !== String(selectedAnswerId)) {
            b.style.opacity = "0.5";
          }
        });
        document.getElementById("submitAnswer").disabled = true;
      }

      /* ---------- countdown ---------- */
      function startCountdown(seconds) {
        stopCountdown();
        secondsLeft = seconds;
        updateTimerDisplay();

        countdownTimer = setInterval(function () {
          secondsLeft--;
          updateTimerDisplay();

          if (secondsLeft <= 0) {
            stopCountdown();
            // Time is up: auto-submit a selected answer, otherwise just lock.
            if (!hasSubmitted && selectedAnswerId !== null) {
              secondsLeft = 0;
              submitAnswer();
            } else if (!hasSubmitted) {
              hasSubmitted = true;
              lockAnswers();
              setGameStatus("Time's up!");
            }
          }
        }, 1000);
      }

      function stopCountdown() {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }

      function updateTimerDisplay() {
        document.getElementById("timeRemaining").textContent =
          Math.max(0, secondsLeft) + " seconds";
      }

      /* ---------- results ---------- */
      function renderScoreboard(scores, title) {
        const board = document.getElementById("scoreboard");
        board.textContent = "";

        const heading = document.createElement("h3");
        heading.textContent = title;
        board.appendChild(heading);

        const list = document.createElement("ol");
        Object.keys(scores)
          .sort(function (a, b) {
            return scores[b] - scores[a];
          })
          .forEach(function (name) {
            const li = document.createElement("li");
            li.textContent = name + " — " + scores[name] + " points";
            if (name === myName) li.style.fontWeight = "bold";
            list.appendChild(li);
          });
        board.appendChild(list);
      }

      function showQuestionResults(data) {
        stopCountdown();
        lockAnswers();

        const mine = data.results[myName];
        if (mine) {
          if (!mine.answered) {
            setGameStatus("You didn't answer in time. +0 points");
          } else if (mine.correct) {
            setGameStatus("Correct! +" + mine.points + " points");
          } else {
            setGameStatus("Incorrect. +0 points");
          }
        }

        if (typeof data.scores[myName] !== "undefined") {
          myScore = data.scores[myName];
          document.getElementById("playerScore").textContent =
            myScore + " points";
        }

        renderScoreboard(data.scores, "Scoreboard");
      }

      function showGameOver(data) {
        stopCountdown();
        document.getElementById("questionText").textContent = "Game over!";
        document.getElementById("choices").textContent = "";
        document.getElementById("questionMedia").hidden = true;
        document.getElementById("submitAnswer").hidden = true;
        document.getElementById("timeRemaining").textContent = "-";
        setGameStatus("Thanks for playing!");

        if (typeof data.scores[myName] !== "undefined") {
          document.getElementById("playerScore").textContent =
            data.scores[myName] + " points";
        }
        renderScoreboard(data.scores, "Final results");
      }

      window.addEventListener("DOMContentLoaded", function () {
        document
          .getElementById("submitAnswer")
          .addEventListener("click", submitAnswer);
      });
    </script>
  </head>
  <body>
    <main>
      <header>
        <h1>Trivia</h1>
        <p>Multiplayer Quiz</p>
      </header>

      <section class="game-panel" aria-label="Multiplayer quiz">
        <div class="game-info">
          <p>Player: <strong id="playerName">Guest</strong></p>
          <p class="timer">
            Time left: <strong id="timeRemaining">30 seconds</strong>
          </p>
          <p>Score: <strong id="playerScore">0 points</strong></p>
        </div>

        <p class="progress">
          <span id="categoryName">Geography</span> &bull;
          <span id="questionNumber">Question 1 of 10</span>
        </p>
        <section class="question" aria-labelledby="questionText">
          <h2 id="questionText">What is the capital of Canada?</h2>
          <!-- Replace this optional placeholder with question media when available. -->
          <div id="questionMedia" class="media-placeholder" hidden>
            Optional question image or video
          </div>
        </section>

        <fieldset>
          <legend>Choose one answer</legend>
          <div id="choices" class="answers">
            <button type="button" class="answer answer-a" id="answerA">
              <span class="shape" aria-hidden="true">&#9650;</span
              ><span>Toronto</span>
            </button>
            <button type="button" class="answer answer-b" id="answerB">
              <span class="shape" aria-hidden="true">&#9670;</span
              ><span>Ottawa</span>
            </button>
            <button type="button" class="answer answer-c" id="answerC">
              <span class="shape" aria-hidden="true">&#9679;</span
              ><span>Vancouver</span>
            </button>
            <button type="button" class="answer answer-d" id="answerD">
              <span class="shape" aria-hidden="true">&#9632;</span
              ><span>Montreal</span>
            </button>
          </div>
        </fieldset>

        <button type="button" class="submit" id="submitAnswer">
          Submit Answer
        </button>
        <p class="host-note" id="gameStatus" aria-live="polite">
          The host controls when the next question appears.
        </p>
        <div id="scoreboard"></div>
      </section>
    </main>
  </body>
</html>
