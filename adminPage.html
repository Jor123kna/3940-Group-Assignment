<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Trivia</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/common.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="home" href="index.html">&larr; Home</a>
    <h1>Admin</h1>
    <div>
      <span id="who" class="who"></span>
      <button id="logoutBtn" class="btn light" type="button">Logout</button>
    </div>
  </header>

  <p id="message" class="notice" role="status" aria-live="polite"></p>

  <div id="panels" hidden>

    <section class="panel">
      <h2>Categories</h2>
      <p id="categoriesEmpty" class="muted" hidden>No categories yet.</p>
      <ul id="categoryList"></ul>

      <h3>Add a category</h3>
      <form id="categoryForm">
        <label>Name
          <input id="catName" type="text" maxlength="50">
        </label>
        <label>Description (optional)
          <input id="catDesc" type="text" maxlength="200">
        </label>
        <button class="btn" type="submit">Add category</button>
      </form>
    </section>

    <section class="panel">
      <h2 id="questionsHeading">Questions</h2>
      <p id="questionsEmpty" class="muted">Select a category to see and manage its questions.</p>
      <div id="questionList"></div>

      <div id="addQuestion" hidden>
        <h3>Add a question to <span id="addQuestionTo"></span></h3>

        <form id="questionForm">
          <label>Question
            <textarea id="qText" maxlength="500"></textarea>
          </label>

          <fieldset id="answers">
            <legend>Answers <span>&mdash; tick the correct one</span></legend>
            <p class="muted">Fill in 2 to 4 answers. Leave the extra boxes empty for a true/false question.</p>
            <!-- the answer rows are added by admin.js -->
          </fieldset>

          <button class="btn" type="submit">Add question</button>
        </form>
      </div>
    </section>

  </div>
</div>
</body>
</html>
