<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Trivia</title>
  <style>
    :root {
      --purple:      #46178f;
      --purple-dark: #33106b;
      --red:  #e21b3c;
      --blue: #1368ce;  --blue-edge: #0d4a96;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 16px;
      background: var(--purple);
      color: #fff;
      font-family: Montserrat, "Trebuchet MS", Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .home {
      align-self: flex-start;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      opacity: .85;
    }
    .home:hover { opacity: 1; text-decoration: underline; }

    .wrap {
      flex: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 60px;
    }

    h1 { text-align: center; margin: 0 0 18px; font-size: 2.2rem; }

    .card {
      background: var(--purple-dark);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 6px 0 rgba(0,0,0,.25);
    }
    .card h2 { margin: 0 0 18px; font-size: 1.3rem; text-align: center; }

    label { display: block; font-weight: 700; margin-bottom: 6px; }

    input {
      width: 100%;
      font: inherit;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 3px solid transparent;
      border-radius: 8px;
      background: #fff;
      color: #222;
    }
    input:focus { outline: none; border-color: #ffd23f; }

    .error {
      min-height: 1.4em;
      margin: 0 0 12px;
      padding: 0;
      font-weight: 700;
      color: #ffb3c0;
      text-align: center;
    }

    button {
      width: 100%;
      font: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--blue-edge);
    }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>

<a class="home" href="index.html">&larr; Home</a>

<div class="wrap">
  <h1>Trivia</h1>

  <div class="card">
    <h2>Log in</h2>

    <form id="loginForm" autocomplete="on">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="username"
             autocapitalize="off" spellcheck="false" autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password">

      <p id="error" class="error" role="alert"></p>

      <button id="submitBtn" type="submit">Log in</button>
    </form>
  </div>
</div>

<script>
  function $(id) { return document.getElementById(id); }

  // If someone who is already logged in opens this page, send them home.
  (function checkAlreadyLoggedIn() {
    const xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
      if (this.readyState != 4 || this.status != 200) return;
      try {
        if (JSON.parse(this.responseText).loggedIn) {
          window.location.href = "index.html";
        }
      } catch (e) { }
    };
    xhttp.open("GET", "session", true);
    xhttp.send();
  })();

  $("loginForm").onsubmit = function(event) {
    event.preventDefault();

    const name     = $("name").value;
    const password = $("password").value;
    const error    = $("error");

    if (name.trim() === "" || password === "") {
      error.textContent = "Enter your name and password.";
      return;
    }

    error.textContent = "";
    $("submitBtn").disabled = true;

    const xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
      if (this.readyState != 4) return;

      if (this.status == 200) {
        window.location.href = "index.html";
        return;
      }

      $("submitBtn").disabled = false;

      let message = "Could not log in. Please try again.";
      try {
        const body = JSON.parse(this.responseText);
        if (body.error) message = body.error;
      } catch (e) { }

      error.textContent = message;
      $("password").value = "";
      $("password").focus();
    };
    xhttp.open("POST", "login", true);
    xhttp.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    xhttp.setRequestHeader("X-Requested-With", "XMLHttpRequest");
    xhttp.send(
            "name=" + encodeURIComponent(name) +
            "&password=" + encodeURIComponent(password)
    );
  };
</script>
</body>
</html>
