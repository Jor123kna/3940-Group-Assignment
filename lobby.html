<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lobby</title>
  <style>
    :root {
      --purple: #46178f;
      --purple-dark: #33106b;
      --light-purple: #722fd5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 14px 40px;
      background: var(--purple);
      color: #fff;
      font-family: Montserrat, "Trebuchet MS", Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    h2 {
      text-align: center;
    }

    #lobby_box {
      width: 50%;
      height: 60vh;
      margin: 0 auto;
      padding: 10px;
      border-radius: 12px;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: var(--light-purple);
      box-sizing: border-box;
      border: 3px solid var(--purple-dark);
    }

    #participant_list {
      list-style-position: inside;
      padding: 0;
      margin: 0;
    }

    /* ------- Scroll Bar Decoration -------*/
    /* Firefox */
    #lobby_box {
      scrollbar-width: thin;
      scrollbar-color: var(--light-purple) var(--purple-dark);
    }

    /* Chrome, Edge, Safari */
    #lobby_box::-webkit-scrollbar {
      width: 10px;
    }

    #lobby_box::-webkit-scrollbar-track {
      background: var(--purple-dark);
      border-radius: 10px;
    }

    #lobby_box::-webkit-scrollbar-thumb {
      background: var(--light-purple);
      border-radius: 10px;
      border: 2px solid var(--purple-dark);
    }

    #lobby_box::-webkit-scrollbar-thumb:hover {
      background: #9257e8;
    }
    /* ---------------------------- */

    .lobby {
      background: var(--purple-dark);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 6px;
      font-size: 25px;
    }

    h4 {
      text-align: center;
    }
  </style>
  <script>

    let peopleInLobby = [];

    // Helper functions
    function asJSONObject(message) {
      return JSON.parse(message.data.replace(/&quot;/g, '"'));
    }

    // Open a connection to the server 
    // TODO: DYNAMICALLY ASSIGN THIS URL BASED ON THE ?URL= COMPONENT IN THE URL
    const urlParams = new URLSearchParams(window.location.search);
    const lobbyCode = urlParams.get('url');
    let webSocket = new WebSocket(`ws://localhost:8081/3940/websocket/chat/${lobbyCode}`);

    // Handlers for WebSocket events
    webSocket.onopen = function(message) {
        wsOpen(message);
    }
    webSocket.onmessage = function(message) {
        wsGetMessage(message);
    }
    webSocket.onclose = function(message) {
        wsClose(message);
    }
    webSocket.onerror = function(message) {
        wsError(message);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById("username").textContent = sessionStorage.getItem('displayName');
    });

    webSocket.addEventListener('open', () => {
      wsSendMessage(JSON.stringify({'type':'join','username': `${sessionStorage.getItem('displayName')}`}));
    });

    webSocket.addEventListener('close', () => {
      wsSendMessage(JSON.stringify({'type':'leave','username': `${sessionStorage.getItem('displayName')}`}));
    });

    function wsOpen(message) {
        console.log("Connection established with the server: " + message.data);
        console.log("Connected to the server as user: " + sessionStorage.getItem('displayName'));
    }

    function wsSendMessage(message) {
        console.log("Sending message to the server: " + message);
        webSocket.send(message);
    }

    function wsGetMessage(message) {

      try {
        if (message.data.startsWith("{")) {
          var data = asJSONObject(message);
          console.log("Received message from the server: ");
          for (var property in data) {
              console.log(property + ": " + data[property]);
          }

          switch (data.type) {
            case "join":
              document.getElementById("participant_list").textContent = "";
              if (sessionStorage.getItem('adminFor') === lobbyCode) // IF I AM THE HOST
              {
                // Add the new person to the list and then send out the entire list again
                peopleInLobby.push(data.username);
                // Needs to send the full list instead of just the new participant
                for (const person of peopleInLobby)
                {
                  wsSendMessage(JSON.stringify({'type':'add_participant','username': person}));
                  var participantList = document.getElementById("participant_list");
                  var newParticipant = document.createElement("li");
                  newParticipant.className = "lobby";
                  newParticipant.textContent = person;
                  participantList.appendChild(newParticipant);
                }
              }
              break;

            case "add_participant":

              var participantList = document.getElementById("participant_list");
              var newParticipant = document.createElement("li");
              newParticipant.className = "lobby";
              newParticipant.textContent = data.username;
              participantList.appendChild(newParticipant);
              break;

            case "start_game":
              // Redirect to the game page
              window.location.href = "triviauser.html?websocket=" + encodeURIComponent(webSocket.url);
              break;

            case "leave":
              if (sessionStorage.getItem('adminFor') === lobbyCode) // IF I AM THE HOST
              {
                // Remove the participant from the list
                peopleInLobby = peopleInLobby.filter(person => person !== data.username);
                // Send out the updated list to all participants
                for (const person of peopleInLobby)
                {
                  wsSendMessage(JSON.stringify({'type':'add_participant','username': person}));
                }
              }
              break;


            default:
                console.log("Unknown message type: " + data.type);
                break;
          }
        }
      }
      catch (e) {
        console.log("Received message from the server: " + message.data + e);
      }
    }

    function wsClose(message) {
        console.log("Connection closed by the server.");
    }

    function wsError(message) {
        console.log("Error occurred: " + message.data);
    }

  </script>
</head>

<body>
  <div>
    <h1>Welcome to the lobby!</h1>
    <br>
    <!-- The typed username can be displayed here -->
    <h2>Your name is displayed as: <i id="username"></i></h2>
    <h2>List of participants</h2>
  </div>

  <div id="lobby_box">
    <ol id="participant_list">
      <!-- participants can get added to the ordered list with this format: <li class="lobby">John Doe</li> -->
    </ol>
  </div>
  <h4><i>Waiting for host to start...</i></h4>
</body>

</html>
