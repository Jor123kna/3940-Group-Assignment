<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lobby</title>
  <style>
    :root {
      --purple: #46178f;
      --purple-dark: #33106b;
      --light-purple: #722fd5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 14px 40px;
      background: var(--purple);
      color: #fff;
      font-family: Montserrat, "Trebuchet MS", Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    h2 {
      text-align: center;
    }

    #lobby_box {
      width: 50%;
      height: 60vh;
      margin: 0 auto;
      padding: 10px;
      border-radius: 12px;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: var(--light-purple);
      box-sizing: border-box;
      border: 3px solid var();
    }

    #participant_list {
      list-style-position: inside;
      padding: 0;
      margin: 0;
    }

    /* ------- Scroll Bar Decoration -------*/
    /* Firefox */
    #lobby_box {
      scrollbar-width: thin;
      scrollbar-color: var(--light-purple) var(--purple-dark);
    }

    /* Chrome, Edge, Safari */
    #lobby_box::-webkit-scrollbar {
      width: 10px;
    }

    #lobby_box::-webkit-scrollbar-track {
      background: var(--purple-dark);
      border-radius: 10px;
    }

    #lobby_box::-webkit-scrollbar-thumb {
      background: var(--light-purple);
      border-radius: 10px;
      border: 2px solid var(--purple-dark);
    }

    #lobby_box::-webkit-scrollbar-thumb:hover {
      background: #9257e8;
    }
    /* ---------------------------- */

    .lobby {
      background: var(--purple-dark);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 6px;
      font-size: 25px;
    }

    h4 {
      text-align: center;
    }
  </style>
</head>

<body>
  <div>
    <h1>Welcome to the lobby!</h1>
    <br>
    <!-- The typed username can be displayed here -->
    <h2>Your name is displayed as: <i id="username"></i></h2>
    <h2>List of participants</h2>
  </div>

  <div id="lobby_box">
    <ol id="participant_list">
      <!-- participants can get added to the ordered list with this format: <li class="lobby">John Doe</li> -->
    </ol>
  </div>
  <h4><i>Waiting for host to start...</i></h4>
</body>

</html>
