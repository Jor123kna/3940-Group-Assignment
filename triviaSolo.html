<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trivia</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/solo.css">
  <script src="js/common.js" defer></script>
  <script src="js/quiz.js" defer></script>
  <script src="js/solo.js" defer></script>
</head>
<body>
<div class="app">

  <a class="home" href="index.html">&larr; Home</a>

  <h1>Trivia</h1>

  <div class="layout">

    <div class="panel category-panel">

      <h2>Categories</h2>
      <nav id="categories" aria-label="Categories"></nav>

    </div>
    
    <div class="panel frame">

      <p id="status" class="notice">Loading categories...</p>

      <section id="game" hidden>
        <p id="progress" class="progress"></p>
        
        <div class="question-box">
          <h2 id="questionText"></h2>
          <div id="questionMedia" class="media" hidden></div>
        </div>
        
        <p id="feedback" class="notice" aria-live="polite"></p>
        
        <div id="choices" class="choices"></div>
        
        <footer>
          <button type="button" id="backBtn" class="btn light">Back</button>
          <button type="button" id="nextBtn" class="btn light">Next</button>
        </footer>
        
      </section>
      
      <section id="results" class="results" hidden>
        <p>Quiz complete!</p>
        <strong id="score"></strong>
        <p id="scoreText"></p>
        <button type="button" id="againBtn" class="btn light">Play again</button>
      </section>
      
    </div>
  </div>
</div>

</body>
</html>
