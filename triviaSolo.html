<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trivia</title>
  <style>
    :root {
      --purple:      #46178f;
      --purple-dark: #33106b;
      --red:    #e21b3c;  --red-edge:    #a8132c;
      --blue:   #1368ce;  --blue-edge:   #0d4a96;
      --gold:   #d89e00;  --gold-edge:   #a07400;
      --green:  #26890c;  --green-edge:  #1a600a;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 14px 40px;
      background: var(--purple);
      color: #fff;
      font-family: Montserrat, "Trebuchet MS", Arial, Helvetica, sans-serif;
    }

    .app { max-width: 880px; margin: 0 auto; }

    .home-link {
      display: inline-block;
      margin-bottom: 6px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      opacity: .85;
    }
    .home-link:hover { opacity: 1; text-decoration: underline; }

    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    /* ---------- the frame that holds everything (see mockup) ---------- */
    .frame {
      background: var(--purple-dark);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 6px 0 rgba(0,0,0,.25);
    }

    /* ---------- category tabs along the top ---------- */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .cat {
      font: inherit;
      font-weight: 700;
      padding: 10px 18px;
      border: 3px solid rgba(255,255,255,.35);
      border-radius: 8px;
      background: transparent;
      color: #fff;
      cursor: pointer;
    }
    .cat:hover { background: rgba(255,255,255,.15); }
    .cat.selected {
      background: #fff;
      color: var(--purple);
      border-color: #fff;
    }

    .status { margin: 24px 0; text-align: center; font-weight: 700; }
    .status.error { color: #ffb3c0; }

    /* ---------- the question ---------- */
    .progress {
      margin: 0 0 8px;
      font-weight: 700;
      opacity: .8;
      font-size: .9rem;
      text-align: center;
    }

    .question-box {
      background: #fff;
      color: #222;
      border-radius: 8px;
      padding: 22px 18px;
      margin-bottom: 14px;
      text-align: center;
      box-shadow: 0 4px 0 rgba(0,0,0,.25);
    }
    .question-box h2 {
      margin: 0;
      font-size: clamp(1.2rem, 3.5vw, 1.8rem);
      line-height: 1.3;
    }
    .question-box img {
      display: block;
      max-width: 100%;
      max-height: 220px;
      margin: 14px auto 0;
      border-radius: 6px;
    }

    .feedback {
      min-height: 2.6em;
      margin: 0 0 10px;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: 700;
    }
    .feedback.correct { background: var(--green); }
    .feedback.wrong   { background: var(--red); }
    .feedback.error   { background: #6b1b2a; }
    .feedback:empty   { background: transparent; }

    /* ---------- the four choices (2 x 2 grid) ---------- */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 96px;
      padding: 14px 16px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      font: inherit;
      font-size: clamp(1rem, 2.6vw, 1.35rem);
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: transform .08s, opacity .2s;
    }
    .choice:hover:not(:disabled) { transform: translateY(-2px); }
    .choice:active:not(:disabled) { transform: translateY(2px); }
    .choice:disabled { cursor: default; }

    .c0 { background: var(--red);  box-shadow: 0 5px 0 var(--red-edge); }
    .c1 { background: var(--blue); box-shadow: 0 5px 0 var(--blue-edge); }
    .c2 { background: var(--gold); box-shadow: 0 5px 0 var(--gold-edge); }
    .c3 { background: var(--green);box-shadow: 0 5px 0 var(--green-edge); }

    .shape { font-size: 1.8rem; line-height: 1; flex: none; }
    .label { flex: 1; overflow-wrap: anywhere; }
    .mark  { font-size: 1.8rem; flex: none; }

    /* after answering: fade everything except the right answer */
    .choices.answered .choice { opacity: .35; }
    .choices.answered .choice.correct { opacity: 1; outline: 4px solid #fff; }
    .choices.answered .choice.wrong   { opacity: .8;  outline: 4px dashed #fff; }

    /* ---------- Back / Next ---------- */
    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
    }
    .nav {
      font: inherit;
      font-weight: 700;
      font-size: 1.05rem;
      min-width: 110px;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: var(--purple);
      box-shadow: 0 4px 0 rgba(0,0,0,.3);
      cursor: pointer;
    }
    .nav:disabled {
      opacity: .35;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ---------- results ---------- */
    .results { text-align: center; padding: 20px 0 6px; }
    .results .score { font-size: 3rem; font-weight: 800; margin: 6px 0; }
    .results p { margin: 6px 0 18px; }

    @media (max-width: 560px) {
      .choices { grid-template-columns: 1fr; }
      .choice  { min-height: 72px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .choice { transition: none; }
    }
  </style>
</head>
<body>
<div class="app">

  <a class="home-link" href="index.html">&larr; Home</a>

  <h1>Trivia</h1>

  <div class="frame">

    <nav id="categories" class="categories" aria-label="Categories"></nav>

    <p id="status" class="status">Loading categories...</p>

    <section id="game" hidden>
      <p id="progress" class="progress"></p>

      <div class="question-box">
        <h2 id="questionText"></h2>
        <img id="questionMedia" alt="" hidden>
      </div>

      <p id="feedback" class="feedback" aria-live="polite"></p>

      <div id="choices" class="choices"></div>

      <div class="footer">
        <button type="button" id="backBtn" class="nav">Back</button>
        <button type="button" id="nextBtn" class="nav">Next</button>
      </div>
    </section>

    <section id="results" class="results" hidden>
      <p>Quiz complete!</p>
      <div id="score" class="score"></div>
      <p id="scoreText"></p>
      <button type="button" id="againBtn" class="nav">Play again</button>
    </section>

  </div>
</div>

<script>
  // Kahoot-style shapes for the four choice colours
  const SHAPES = ["\u25B2", "\u25C6", "\u25CF", "\u25A0"];   // triangle, diamond, circle, square

  // AJAX helpers (XMLHttpRequest). URLs are relative, so this works at
  // /GroupAssignment1/ on any host or port.
  function request(method, url, body, onSuccess, onError) {
    const xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
      if (this.readyState != 4) return;

      if (this.status == 200) {
        try {
          onSuccess(JSON.parse(this.responseText));
        } catch (e) {
          onError("The server sent a response that could not be read.");
        }
      } else {
        onError("The server returned an error (status " + this.status + ").");
      }
    };
    xhttp.open(method, url, true);
    if (body !== null) {
      xhttp.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    }
    xhttp.send(body);
  }

  function getJson(url, onSuccess, onError) {
    request("GET", url, null, onSuccess, onError);
  }

  function postForm(url, body, onSuccess, onError) {
    request("POST", url, body, onSuccess, onError);
  }

  function $(id) { return document.getElementById(id); }

  function setStatus(text, isError) {
    const status = $("status");
    status.textContent = text;
    status.className = isError ? "status error" : "status";
    status.hidden = (text === "");
  }

  // Categories: one tab per category, along the top
  function loadCategories() {
    getJson("categories", showCategories, function(message) {
      setStatus("Could not load categories. " + message, true);
    });
  }

  function showCategories(categories) {
    const holder = $("categories");
    holder.textContent = "";

    if (categories.length == 0) {
      setStatus("No categories found.", false);
      return;
    }

    setStatus("Pick a category to start.", false);

    categories.forEach(function(category) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "cat";
      button.textContent = category.category_name;
      button.onclick = function() { selectCategory(button, category); };
      holder.appendChild(button);
    });
  }

  // Game state
  //   questions : the questions in this category
  //   index     : which question is on screen
  //   results   : question_id -> { answerId, correct, correctAnswerId }
  //   pending   : question_id -> true while an answer is being checked
  let game = null;

  function selectCategory(button, category) {
    document.querySelectorAll("#categories .cat").forEach(function(b) {
      b.classList.remove("selected");
    });
    button.classList.add("selected");

    // starting a new category throws away the old game
    const thisGame = { category: category, questions: [], index: 0,
      results: {}, pending: {} };
    game = thisGame;

    $("game").hidden = true;
    $("results").hidden = true;
    setStatus("Loading questions...", false);

    getJson(
            "questions?category_id=" + encodeURIComponent(category.category_id),
            function(questions) {
              if (game !== thisGame) return;   // user already picked another category

              if (questions.length == 0) {
                setStatus("There are no questions in " + category.category_name +
                        " yet.", false);
                return;
              }

              thisGame.questions = questions;
              setStatus("", false);
              renderQuestion();
            },
            function(message) {
              if (game !== thisGame) return;
              setStatus("Could not load questions. " + message, true);
            }
    );
  }

  // Show the current question
  function mediaSource(url) {
    if (/^https?:\/\//i.test(url)) return url;
    return "images/" + encodeURIComponent(url);   // file in the webapp's images folder
  }

  function renderQuestion() {
    const q   = game.questions[game.index];
    const res = game.results[q.question_id];
    const last = (game.index == game.questions.length - 1);

    $("results").hidden = true;
    $("game").hidden = false;

    $("progress").textContent =
            game.category.category_name + " \u2022 Question " +
            (game.index + 1) + " of " + game.questions.length;

    $("questionText").textContent = q.question_text;

    // optional picture that belongs to the question
    const img = $("questionMedia");
    if (q.media && q.media.type == "image") {
      img.onerror = function() { img.hidden = true; }; // missing file: just hide it
      img.src = mediaSource(q.media.url);
      img.hidden = false;
    } else {
      img.hidden = true;
      img.removeAttribute("src");
    }

    // the choices
    const choices = $("choices");
    choices.textContent = "";
    choices.className = res ? "choices answered" : "choices";

    q.answers.forEach(function(answer, i) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice c" + (i % 4);

      const shape = document.createElement("span");
      shape.className = "shape";
      shape.textContent = SHAPES[i % 4];

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = answer.answer_name;

      const mark = document.createElement("span");
      mark.className = "mark";

      button.appendChild(shape);
      button.appendChild(label);
      button.appendChild(mark);

      if (res) {
        button.disabled = true;
        if (answer.answer_id == res.correctAnswerId) {
          button.classList.add("correct");
          mark.textContent = "\u2713";
        } else if (answer.answer_id == res.answerId) {
          button.classList.add("wrong");
          mark.textContent = "\u2717";
        }
      } else {
        button.disabled = !!game.pending[q.question_id];
        button.onclick = function() { chooseAnswer(q, answer); };
      }

      choices.appendChild(button);
    });

    // feedback line
    const feedback = $("feedback");
    feedback.className = "feedback";
    feedback.textContent = "";
    if (res) {
      if (res.correct) {
        feedback.classList.add("correct");
        feedback.textContent = "\u2713 Correct!";
      } else {
        const right = q.answers.filter(function(a) {
          return a.answer_id == res.correctAnswerId;
        })[0];
        feedback.classList.add("wrong");
        feedback.textContent = "\u2717 Not quite" +
                (right ? " \u2014 the answer is " + right.answer_name : "");
      }
    }

    // Back is available after the first question.
    // Next only unlocks once this question has been answered.
    $("backBtn").disabled = (game.index == 0);
    $("nextBtn").disabled = !res;
    $("nextBtn").textContent = last ? "Finish" : "Next";
  }

  // Player picks a choice -> ask the server whether it was right
  function chooseAnswer(q, answer) {
    const thisGame = game;

    if (thisGame.results[q.question_id] || thisGame.pending[q.question_id]) return;

    thisGame.pending[q.question_id] = true;
    document.querySelectorAll("#choices .choice").forEach(function(b) {
      b.disabled = true;     // no double-clicks while we wait
    });

    postForm(
            "answer",
            "answer_id=" + encodeURIComponent(answer.answer_id),
            function(result) {
              delete thisGame.pending[q.question_id];
              thisGame.results[q.question_id] = {
                answerId: answer.answer_id,
                correct: result.correct,
                correctAnswerId: result.correct_answer_id
              };
              if (game === thisGame && thisGame.questions[thisGame.index] === q) {
                renderQuestion();
              }
            },
            function(message) {
              delete thisGame.pending[q.question_id];
              if (game === thisGame && thisGame.questions[thisGame.index] === q) {
                renderQuestion();    // re-enable the choices so they can try again
                const feedback = $("feedback");
                feedback.className = "feedback error";
                feedback.textContent = "Could not check your answer. " + message;
              }
            }
    );
  }

  // Back / Next / results
  $("backBtn").onclick = function() {
    if (game && game.index > 0) {
      game.index--;
      renderQuestion();
    }
  };

  $("nextBtn").onclick = function() {
    if (!game) return;
    const q = game.questions[game.index];
    if (!game.results[q.question_id]) return; // must answer first

    if (game.index < game.questions.length - 1) {
      game.index++;
      renderQuestion();
    } else {
      showResults();
    }
  };

  function showResults() {
    let correct = 0;
    game.questions.forEach(function(q) {
      const r = game.results[q.question_id];
      if (r && r.correct) correct++;
    });

    $("game").hidden = true;
    $("results").hidden = false;
    $("score").textContent = correct + " / " + game.questions.length;
    $("scoreText").textContent =
            "You got " + correct + " of " + game.questions.length +
            " right in " + game.category.category_name + ". " +
            "Play again or pick another category above.";
  }

  $("againBtn").onclick = function() {
    game.index = 0;
    game.results = {};
    game.pending = {};
    renderQuestion();
  };

  loadCategories();
</script>
</body>
</html>
